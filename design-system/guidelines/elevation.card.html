<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(26,26,46,.08)}.lab{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}.hex{font-size:10px;font-family:var(--font-mono);color:var(--text-heading)}</style></head><body><div class="row" style="gap:18px">
<div class="sw"><div style="height:62px;background:var(--paper-raised);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-xs)"></div><span class="lab">--shadow-xs</span><span class="hex">controls</span></div><div class="sw"><div style="height:62px;background:var(--paper-raised);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><span class="lab">--shadow-sm</span><span class="hex">cards</span></div><div class="sw"><div style="height:62px;background:var(--paper-raised);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div><span class="lab">--shadow-md</span><span class="hex">popovers</span></div><div class="sw"><div style="height:62px;background:var(--paper-raised);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><span class="lab">--shadow-lg</span><span class="hex">dialogs, toasts</span></div></div></body></html>
