<!-- @dsCard group="Colors" viewport="700x150" name="Bag &amp; session status" subtitle="Indigo, lavender, mint, slate — deliberately not the ramp" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(26,26,46,.08)}.lab{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}.hex{font-size:10px;font-family:var(--font-mono);color:var(--text-heading)}</style></head><body><div class="col" style="gap:14px">
<div class="row" style="gap:10px">
<span style="display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius-full);background:var(--bag-frozen-soft);color:var(--bag-frozen);padding:4px 12px;font-size:13px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>frozen</span><span style="display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius-full);background:var(--bag-resting-soft);color:var(--bag-resting);padding:4px 12px;font-size:13px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>resting</span><span style="display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius-full);background:var(--bag-active-soft);color:var(--bag-active);padding:4px 12px;font-size:13px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>active</span><span style="display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius-full);background:var(--bag-finished-soft);color:var(--bag-finished);padding:4px 12px;font-size:13px;font-weight:500"><span style="width:6px;height:6px;border-radius:99px;background:currentColor"></span>finished</span>
<span style="display:inline-flex;border-radius:var(--radius-full);background:var(--session-active-soft);color:var(--session-active);padding:4px 12px;font-size:13px;font-weight:500">active</span>
<span style="display:inline-flex;border-radius:var(--radius-full);background:var(--session-complete-soft);color:var(--session-complete);padding:4px 12px;font-size:13px;font-weight:500">complete</span>
</div>
<div class="row" style="gap:12px"><div class="sw"><div class="chip" style="background:var(--bag-frozen)"></div><span class="lab">--bag-frozen</span><span class="hex">#6b76c0</span></div><div class="sw"><div class="chip" style="background:var(--bag-resting)"></div><span class="lab">--bag-resting</span><span class="hex">#7659ad</span></div><div class="sw"><div class="chip" style="background:var(--bag-active)"></div><span class="lab">--bag-active</span><span class="hex">#3f9a86</span></div><div class="sw"><div class="chip" style="background:var(--bag-finished)"></div><span class="lab">--bag-finished</span><span class="hex">#6f6b80</span></div></div>
</div></body></html>
