<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Paper, rails, hairlines, quiet text" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(26,26,46,.08)}.lab{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}.hex{font-size:10px;font-family:var(--font-mono);color:var(--text-heading)}</style></head><body><div class="row" style="gap:14px"><div class="sw"><div class="chip" style="background:var(--paper)"></div><span class="lab">--paper</span><span class="hex">#fcfbfa</span></div><div class="sw"><div class="chip" style="background:var(--paper-raised)"></div><span class="lab">--paper-raised</span><span class="hex">#ffffff</span></div><div class="sw"><div class="chip" style="background:var(--paper-sunken)"></div><span class="lab">--paper-sunken</span><span class="hex">#f4f2f0</span></div><div class="sw"><div class="chip" style="background:var(--slate-100)"></div><span class="lab">--slate-100</span><span class="hex">#f1f0f5</span></div><div class="sw"><div class="chip" style="background:var(--slate-200)"></div><span class="lab">--slate-200</span><span class="hex">#e4e1ec</span></div><div class="sw"><div class="chip" style="background:var(--slate-300)"></div><span class="lab">--slate-300</span><span class="hex">#cfcbdb</span></div><div class="sw"><div class="chip" style="background:var(--slate-500)"></div><span class="lab">--slate-500</span><span class="hex">#6f6b80</span></div><div class="sw"><div class="chip" style="background:var(--slate-700)"></div><span class="lab">--slate-700</span><span class="hex">#413d52</span></div></div></body></html>
