<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(26,26,46,.08)}.lab{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}.hex{font-size:10px;font-family:var(--font-mono);color:var(--text-heading)}</style></head><body><div class="row" style="gap:16px"><div class="sw"><div class="chip" style="background:var(--indigo-600)"></div><span class="lab">--indigo-600</span><span class="hex">#3b3f8f</span></div><div class="sw"><div class="chip" style="background:var(--lavender-500)"></div><span class="lab">--lavender-500</span><span class="hex">#8f74c4</span></div><div class="sw"><div class="chip" style="background:var(--mint-600)"></div><span class="lab">--mint-600</span><span class="hex">#3f9a86</span></div><div class="sw"><div class="chip" style="background:var(--indigo-950)"></div><span class="lab">--indigo-950</span><span class="hex">#1a1a2e</span></div><div class="sw"><div class="chip" style="background:var(--paper)"></div><span class="lab">--paper</span><span class="hex">#fcfbfa</span></div></div></body></html>
