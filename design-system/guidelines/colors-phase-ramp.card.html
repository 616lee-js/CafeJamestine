<!-- @dsCard group="Colors" viewport="700x180" name="Coffee lifecycle ramp" subtitle="Session phases only — green growth to brown roast" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(26,26,46,.08)}.lab{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}.hex{font-size:10px;font-family:var(--font-mono);color:var(--text-heading)}</style></head><body><div class="col" style="gap:14px">
<div class="row" style="gap:10px">
<div class="sw"><div class="chip" style="background:var(--phase-plan);height:56px"></div><span class="lab">--phase-plan · growth</span><span class="hex">#4e7c4a</span></div><div class="sw"><div class="chip" style="background:var(--phase-brew);height:56px"></div><span class="lab">--phase-brew · cherries</span><span class="hex">#a8323c</span></div><div class="sw"><div class="chip" style="background:var(--phase-post);height:56px"></div><span class="lab">--phase-post · dried</span><span class="hex">#d19a2e</span></div><div class="sw"><div class="chip" style="background:var(--phase-taste);height:56px"></div><span class="lab">--phase-taste · roast</span><span class="hex">#6f4e37</span></div>
</div>
<div class="row" style="gap:10px">
<span style="display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius-full);background:var(--phase-plan-soft);color:var(--phase-plan);padding:4px 12px;font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:99px;background:currentColor"></span>Plan</span><span style="display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius-full);background:var(--phase-brew-soft);color:var(--phase-brew);padding:4px 12px;font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:99px;background:currentColor"></span>Brew</span><span style="display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius-full);background:var(--phase-post-soft);color:var(--phase-post);padding:4px 12px;font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:99px;background:currentColor"></span>Post-brew</span><span style="display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius-full);background:var(--phase-taste-soft);color:var(--phase-taste);padding:4px 12px;font-size:13px;font-weight:500"><span style="width:7px;height:7px;border-radius:99px;background:currentColor"></span>Tasting</span>
</div>
<p style="margin:0;font-size:12px;color:var(--text-muted)">This ramp means one thing: where you are in a session. Never use it for bag status, badges, or decoration.</p>
</div></body></html>
