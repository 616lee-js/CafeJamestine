<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="0.625rem root; 26px for brew tiles; pills for badges" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(26,26,46,.08)}.lab{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}.hex{font-size:10px;font-family:var(--font-mono);color:var(--text-heading)}</style></head><body><div class="row" style="gap:14px">
<div class="sw"><div style="height:58px;background:var(--lavender-50);border:1px solid var(--lavender-200);border-radius:var(--radius-sm)"></div><span class="lab">r-sm</span><span class="hex">6px</span></div><div class="sw"><div style="height:58px;background:var(--lavender-50);border:1px solid var(--lavender-200);border-radius:var(--radius-md)"></div><span class="lab">r-md</span><span class="hex">8px</span></div><div class="sw"><div style="height:58px;background:var(--lavender-50);border:1px solid var(--lavender-200);border-radius:var(--radius-lg)"></div><span class="lab">r-lg</span><span class="hex">10px</span></div><div class="sw"><div style="height:58px;background:var(--lavender-50);border:1px solid var(--lavender-200);border-radius:var(--radius-xl)"></div><span class="lab">r-xl</span><span class="hex">14px</span></div><div class="sw"><div style="height:58px;background:var(--lavender-50);border:1px solid var(--lavender-200);border-radius:var(--radius-2xl)"></div><span class="lab">r-2xl</span><span class="hex">18px</span></div><div class="sw"><div style="height:58px;background:var(--lavender-50);border:1px solid var(--lavender-200);border-radius:var(--radius-3xl)"></div><span class="lab">r-3xl</span><span class="hex">26px</span></div><div class="sw"><div style="height:58px;background:var(--lavender-50);border:1px solid var(--lavender-200);border-radius:var(--radius-full)"></div><span class="lab">r-full</span><span class="hex">pill</span></div></div></body></html>
