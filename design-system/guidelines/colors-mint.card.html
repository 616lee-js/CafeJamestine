<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(26,26,46,.08)}.lab{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}.hex{font-size:10px;font-family:var(--font-mono);color:var(--text-heading)}</style></head><body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px">
