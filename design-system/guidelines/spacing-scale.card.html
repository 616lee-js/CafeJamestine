<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(26,26,46,.08)}.lab{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}.hex{font-size:10px;font-family:var(--font-mono);color:var(--text-heading)}</style></head><body><div class="col" style="gap:6px">
<div style="display:flex;align-items:center;gap:10px"><span class="lab" style="width:82px">--space-1</span><span style="height:10px;width:0.25rem;background:var(--indigo-400);border-radius:2px"></span><span class="hex">0.25rem</span></div><div style="display:flex;align-items:center;gap:10px"><span class="lab" style="width:82px">--space-2</span><span style="height:10px;width:0.5rem;background:var(--indigo-400);border-radius:2px"></span><span class="hex">0.5rem</span></div><div style="display:flex;align-items:center;gap:10px"><span class="lab" style="width:82px">--space-3</span><span style="height:10px;width:0.75rem;background:var(--indigo-400);border-radius:2px"></span><span class="hex">0.75rem</span></div><div style="display:flex;align-items:center;gap:10px"><span class="lab" style="width:82px">--space-4</span><span style="height:10px;width:1rem;background:var(--indigo-400);border-radius:2px"></span><span class="hex">1rem</span></div><div style="display:flex;align-items:center;gap:10px"><span class="lab" style="width:82px">--space-5</span><span style="height:10px;width:1.25rem;background:var(--indigo-400);border-radius:2px"></span><span class="hex">1.25rem</span></div><div style="display:flex;align-items:center;gap:10px"><span class="lab" style="width:82px">--space-6</span><span style="height:10px;width:1.5rem;background:var(--indigo-400);border-radius:2px"></span><span class="hex">1.5rem</span></div><div style="display:flex;align-items:center;gap:10px"><span class="lab" style="width:82px">--space-8</span><span style="height:10px;width:2rem;background:var(--indigo-400);border-radius:2px"></span><span class="hex">2rem</span></div><div style="display:flex;align-items:center;gap:10px"><span class="lab" style="width:82px">--space-10</span><span style="height:10px;width:2.5rem;background:var(--indigo-400);border-radius:2px"></span><span class="hex">2.5rem</span></div><div style="display:flex;align-items:center;gap:10px"><span class="lab" style="width:82px">--space-12</span><span style="height:10px;width:3rem;background:var(--indigo-400);border-radius:2px"></span><span class="hex">3rem</span></div></div></body></html>
