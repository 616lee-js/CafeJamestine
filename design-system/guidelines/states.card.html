<!-- @dsCard group="Spacing" viewport="700x230" name="Interaction &amp; mode states" subtitle="Flat colour swaps; read vs edit is a surface change" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(26,26,46,.08)}.lab{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}.hex{font-size:10px;font-family:var(--font-mono);color:var(--text-heading)}</style></head><body><div class="col" style="gap:16px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div class="sw"><span style="display:flex;align-items:center;justify-content:center;height:38px;border-radius:var(--radius-md);background:var(--primary);color:#fff;opacity:1;font-size:14px;font-weight:500">Start</span><span class="lab">rest</span></div><div class="sw"><span style="display:flex;align-items:center;justify-content:center;height:38px;border-radius:var(--radius-md);background:var(--indigo-700);color:#fff;opacity:1;font-size:14px;font-weight:500">Start</span><span class="lab">hover</span></div><div class="sw"><span style="display:flex;align-items:center;justify-content:center;height:38px;border-radius:var(--radius-md);background:var(--primary);color:#fff;opacity:.5;font-size:14px;font-weight:500">Start</span><span class="lab">disabled</span></div>
<div class="sw"><span style="display:flex;align-items:center;justify-content:center;height:38px;border-radius:var(--radius-md);border:1px solid var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 45%,transparent);font-size:14px;color:var(--text-body)">Focus</span><span class="lab">3px ring</span></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div style="display:flex;flex-direction:column;gap:5px;border-radius:var(--radius-lg);border:1px solid var(--border);padding:12px"><span style="font-size:11px;text-transform:uppercase;letter-spacing:var(--tracking-wide);color:var(--text-muted)">Dose</span><span style="font-size:14px;color:var(--text-body)">18 g</span><span class="lab" style="margin-top:4px">READ — flat on paper</span></div>
<div style="display:flex;flex-direction:column;gap:5px;border-radius:var(--radius-lg);border:1px solid var(--edit-border);background:var(--edit-surface);padding:12px"><span style="font-size:13px;font-weight:500;color:var(--text-body)">Dose (g)</span><span style="display:block;height:30px;border-radius:var(--radius-md);border:1px solid var(--input);background:#fff"></span><span class="lab" style="margin-top:4px">EDIT — lavender field surface</span></div>
</div></div></body></html>
