<!-- @dsCard group="Spacing" viewport="700x200" name="List beside detail" subtitle="The browsing shape: rail stays put, detail swaps" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:10px}.sw{display:flex;flex-direction:column;gap:6px;flex:1}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(26,26,46,.08)}.lab{font-size:10px;font-family:var(--font-mono);color:var(--text-muted)}.hex{font-size:10px;font-family:var(--font-mono);color:var(--text-heading)}</style></head><body><div style="display:grid;grid-template-columns:200px 1fr;gap:20px;height:150px">
<div style="display:flex;flex-direction:column;gap:6px;border-radius:var(--radius-xl);background:var(--surface-rail);border:1px solid var(--border);padding:12px">
<span class="eyebrow">Active</span>
<span style="border-radius:var(--radius-md);background:var(--surface-selected);padding:7px 10px;font-size:13px;font-weight:500;color:var(--text-heading)">Ethiopia Guji</span>
<span style="padding:7px 10px;font-size:13px;color:var(--text-muted)">Colombia El Paraíso</span>
<span class="eyebrow" style="margin-top:6px">Storage</span>
<span style="padding:7px 10px;font-size:13px;color:var(--text-muted)">Kenya Kirinyaga</span></div>
<div style="border-radius:var(--radius-xl);border:1px solid var(--border);background:var(--surface-card);padding:16px;display:flex;flex-direction:column;gap:8px">
<span style="font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:var(--tracking-tight);color:var(--text-heading)">Ethiopia Guji Uraga</span>
<span style="font-size:13px;color:var(--text-muted)">Onyx Coffee Lab · washed · 1,950 masl</span>
<span class="lab" style="margin-top:auto">--list-pane beside minmax(0,1fr), gap --space-8</span></div></div></body></html>
